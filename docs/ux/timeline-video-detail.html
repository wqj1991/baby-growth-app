<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动态详情-视频</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-gray-100 font-sans">
    <div class="flex flex-col h-screen">
        <div class="bg-white/80 backdrop-blur-sm h-10 flex items-center justify-between px-4 text-sm font-medium text-gray-800 shadow-sm z-10">
            <div>10:27</div>
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-signal"></i>
                <i class="fa-solid fa-wifi"></i>
                <i class="fa-solid fa-battery-three-quarters fa-lg"></i>
            </div>
        </div>

        <main class="flex-1 overflow-y-auto custom-scrollbar pb-8">
            <header class="sticky top-0 bg-white/90 backdrop-blur-sm z-10 border-b border-gray-100 px-4 py-3">
                <div class="flex items-center gap-3">
                    <a href="home.html" class="w-9 h-9 rounded-full bg-gray-100 flex items-center justify-center text-gray-700">
                        <i class="fa-solid fa-arrow-left"></i>
                    </a>
                    <div>
                        <p class="font-semibold text-gray-900">动态详情</p>
                        <p class="text-xs text-gray-500">视频记录</p>
                    </div>
                </div>
            </header>

            <section class="p-4">
                <article class="bg-white rounded-2xl shadow-sm overflow-hidden">
                    <div class="p-4">
                        <div class="flex items-center gap-3">
                            <img class="h-10 w-10 rounded-full object-cover" src="assets/images/dad-avatar.jpg" alt="爸爸">
                            <div>
                                <p class="text-sm font-semibold text-gray-800">爸爸</p>
                                <p class="text-xs text-gray-500">5小时前</p>
                            </div>
                        </div>
                        <p class="mt-3 text-gray-700">宝宝第一次自己走路，必须记录下来！</p>
                    </div>

                    <div id="videoPlayerContainer" class="relative bg-black cursor-pointer" role="button" aria-label="播放视频" tabindex="0">
                        <video id="timelineVideo" class="w-full h-auto hidden" controls preload="metadata" poster="assets/images/baby-walking.jpg">
                            <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" type="video/mp4">
                            当前浏览器不支持视频播放。
                        </video>
                        <img id="videoPoster" class="w-full h-auto opacity-90" src="assets/images/baby-walking.jpg" alt="宝宝走路视频">
                        <div id="videoOverlay" class="absolute inset-0 flex items-center justify-center">
                            <div class="w-16 h-16 rounded-full bg-white/80 flex items-center justify-center text-gray-900">
                                <i class="fa-solid fa-play text-2xl"></i>
                            </div>
                        </div>
                    </div>

                    <div class="p-4 border-t border-gray-100">
                        <div class="flex items-center justify-between text-sm">
                            <span class="text-gray-500">点赞 25 · 评论 8</span>
                            <a href="#" class="text-blue-500 font-semibold">下载视频</a>
                        </div>
                        <div class="mt-4 rounded-xl bg-gray-50 p-3">
                            <p class="text-xs text-gray-400">成长里程碑</p>
                            <p class="mt-1 text-sm text-gray-700">首次独立行走，已自动归档到成长关键事件。</p>
                        </div>
                    </div>
                </article>
            </section>
        </main>

        <div class="px-4 pb-4 pt-3 bg-white border-t border-gray-200">
            <a href="home.html" class="block w-full rounded-2xl bg-blue-500 text-white text-center py-4 font-semibold">返回首页时间轴</a>
        </div>
    </div>

    <script>
        const videoPlayerContainer = document.getElementById('videoPlayerContainer');
        const timelineVideo = document.getElementById('timelineVideo');
        const videoPoster = document.getElementById('videoPoster');
        const videoOverlay = document.getElementById('videoOverlay');

        function playTimelineVideo() {
            videoPoster.classList.add('hidden');
            videoOverlay.classList.add('hidden');
            timelineVideo.classList.remove('hidden');
            timelineVideo.play().catch(() => {
                // Autoplay may be blocked; controls remain available for manual play.
            });
        }

        videoPlayerContainer.addEventListener('click', playTimelineVideo);
        videoPlayerContainer.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' || event.key === ' ') {
                event.preventDefault();
                playTimelineVideo();
            }
        });
    </script>
</body>
</html>
