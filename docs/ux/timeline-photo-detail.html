<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动态详情-图文</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-gray-100 font-sans">
    <div class="flex flex-col h-screen">
        <div class="bg-white/80 backdrop-blur-sm h-10 flex items-center justify-between px-4 text-sm font-medium text-gray-800 shadow-sm z-10">
            <div>10:26</div>
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-signal"></i>
                <i class="fa-solid fa-wifi"></i>
                <i class="fa-solid fa-battery-three-quarters fa-lg"></i>
            </div>
        </div>

        <main class="flex-1 overflow-y-auto custom-scrollbar pb-8">
            <header class="sticky top-0 bg-white/90 backdrop-blur-sm z-10 border-b border-gray-100 px-4 py-3">
                <div class="flex items-center gap-3">
                    <a href="home.html" class="w-9 h-9 rounded-full bg-gray-100 flex items-center justify-center text-gray-700">
                        <i class="fa-solid fa-arrow-left"></i>
                    </a>
                    <div>
                        <p class="font-semibold text-gray-900">动态详情</p>
                        <p class="text-xs text-gray-500">图文记录</p>
                    </div>
                </div>
            </header>

            <section class="p-4">
                <article class="bg-white rounded-2xl shadow-sm overflow-hidden">
                    <div class="p-4">
                        <div class="flex items-center gap-3">
                            <img class="h-10 w-10 rounded-full object-cover" src="assets/images/mom-avatar.jpg" alt="妈妈">
                            <div>
                                <p class="text-sm font-semibold text-gray-800">妈妈</p>
                                <p class="text-xs text-gray-500">2小时前</p>
                            </div>
                        </div>
                        <p class="mt-3 text-gray-700">今天天气真好，带宝宝去公园玩啦！还练习了小跑步，状态超好。</p>
                    </div>
                    <button id="openImagePreview" class="w-full block text-left" type="button">
                        <img class="w-full h-auto" src="assets/images/baby-park.jpg" alt="宝宝在公园">
                    </button>
                    <div class="p-4 border-t border-gray-100">
                        <div class="flex items-center justify-between text-sm">
                            <span class="text-gray-500">点赞 12 · 评论 3</span>
                            <a href="#" class="text-blue-500 font-semibold">下载原图</a>
                        </div>
                        <div class="mt-4 rounded-xl bg-gray-50 p-3">
                            <p class="text-xs text-gray-400">家庭评论</p>
                            <p class="mt-1 text-sm text-gray-700">爸爸：今天拍得真好，笑得好开心。</p>
                        </div>
                    </div>
                </article>
            </section>
        </main>

        <div class="px-4 pb-4 pt-3 bg-white border-t border-gray-200">
            <a href="home.html" class="block w-full rounded-2xl bg-blue-500 text-white text-center py-4 font-semibold">返回首页时间轴</a>
        </div>
    </div>

    <div id="imagePreviewModal" class="fixed inset-0 bg-black/90 items-center justify-center p-4 hidden z-50">
        <button id="closeImagePreview" type="button" class="absolute top-4 right-4 w-10 h-10 rounded-full bg-white/20 text-white">
            <i class="fa-solid fa-xmark"></i>
        </button>
        <img src="assets/images/baby-park.jpg" alt="宝宝在公园大图" class="max-w-full max-h-full rounded-xl shadow-2xl">
    </div>

    <script>
        const openImagePreview = document.getElementById('openImagePreview');
        const imagePreviewModal = document.getElementById('imagePreviewModal');
        const closeImagePreview = document.getElementById('closeImagePreview');

        openImagePreview.addEventListener('click', () => {
            imagePreviewModal.classList.remove('hidden');
            imagePreviewModal.classList.add('flex');
        });

        function hidePreview() {
            imagePreviewModal.classList.add('hidden');
            imagePreviewModal.classList.remove('flex');
        }

        closeImagePreview.addEventListener('click', hidePreview);
        imagePreviewModal.addEventListener('click', (event) => {
            if (event.target === imagePreviewModal) {
                hidePreview();
            }
        });
    </script>
</body>
</html>
