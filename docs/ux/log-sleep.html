<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>睡眠记录</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-indigo-50 font-sans">
    <div class="flex flex-col h-screen">
        <div class="bg-white/80 backdrop-blur-sm h-10 flex items-center justify-between px-4 text-sm font-medium text-gray-800 shadow-sm z-10">
            <div>10:38</div>
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-signal"></i>
                <i class="fa-solid fa-wifi"></i>
                <i class="fa-solid fa-battery-three-quarters fa-lg"></i>
            </div>
        </div>

        <main class="flex-1 overflow-y-auto custom-scrollbar pb-8">
            <header class="bg-gradient-to-br from-indigo-500 via-violet-500 to-fuchsia-500 px-5 pt-5 pb-8 text-white rounded-b-[32px] shadow-lg">
                <div class="flex items-center justify-between">
                    <a href="record.html" class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center">
                        <i class="fa-solid fa-arrow-left"></i>
                    </a>
                    <span class="text-sm font-medium tracking-wide">睡眠追踪</span>
                    <button class="text-sm font-semibold">历史</button>
                </div>
                <h1 class="mt-6 text-3xl font-bold">睡眠记录</h1>
                <p class="mt-2 text-sm text-white/85">记录白天和夜间睡眠，帮助观察作息节奏是否稳定。</p>
            </header>

            <section class="px-4 -mt-5 space-y-4">
                <div class="bg-white rounded-3xl shadow-sm p-4">
                    <p class="text-sm font-semibold text-gray-900">睡眠类型</p>
                    <div class="mt-3 grid grid-cols-2 gap-3">
                        <button class="rounded-2xl bg-indigo-500 text-white py-4 font-semibold">白天睡眠</button>
                        <button class="rounded-2xl bg-slate-100 text-slate-600 py-4 font-semibold">夜间睡眠</button>
                    </div>
                </div>

                <div class="bg-white rounded-3xl shadow-sm p-4">
                    <p class="text-sm font-semibold text-gray-900">时间区间</p>
                    <div class="mt-3 grid grid-cols-2 gap-3">
                        <div class="rounded-2xl bg-indigo-50 border border-indigo-100 px-4 py-4">
                            <p class="text-xs text-indigo-500">开始入睡</p>
                            <p class="mt-2 text-2xl font-bold text-gray-900">13:10</p>
                        </div>
                        <div class="rounded-2xl bg-slate-50 px-4 py-4">
                            <p class="text-xs text-gray-400">醒来时间</p>
                            <p class="mt-2 text-2xl font-bold text-gray-900">14:45</p>
                        </div>
                    </div>
                    <div class="mt-3 rounded-2xl bg-slate-900 text-white px-4 py-4">
                        <p class="text-xs text-white/60">本次总时长</p>
                        <p class="mt-2 text-3xl font-bold">1 小时 35 分</p>
                    </div>
                </div>

                <div class="bg-white rounded-3xl shadow-sm p-4">
                    <div class="flex items-center justify-between">
                        <p class="text-sm font-semibold text-gray-900">睡眠质量</p>
                        <span class="text-xs text-indigo-600 font-medium">本周平均 9.8h/天</span>
                    </div>
                    <div class="mt-3 flex items-center justify-between gap-3 text-center text-sm">
                        <div class="flex-1 rounded-2xl bg-indigo-100 text-indigo-700 py-4 font-semibold">入睡快</div>
                        <div class="flex-1 rounded-2xl bg-slate-100 text-slate-600 py-4 font-semibold">易惊醒</div>
                        <div class="flex-1 rounded-2xl bg-slate-100 text-slate-600 py-4 font-semibold">哭闹</div>
                    </div>
                </div>

                <div class="bg-white rounded-3xl shadow-sm p-4">
                    <p class="text-sm font-semibold text-gray-900">入睡前状态</p>
                    <div class="mt-3 space-y-3 text-sm">
                        <div class="rounded-2xl bg-slate-50 px-4 py-3 flex items-center justify-between">
                            <span>已喂奶</span>
                            <i class="fa-solid fa-check text-emerald-500"></i>
                        </div>
                        <div class="rounded-2xl bg-slate-50 px-4 py-3 flex items-center justify-between">
                            <span>白噪音辅助</span>
                            <i class="fa-solid fa-check text-emerald-500"></i>
                        </div>
                        <div class="rounded-2xl border border-dashed border-slate-200 px-4 py-3 text-gray-400">补充备注：入睡前玩耍较兴奋、换了睡袋等</div>
                    </div>
                </div>
            </section>
        </main>

        <div class="px-4 pb-4 pt-3 bg-white border-t border-slate-200">
            <div class="flex gap-3">
                <a href="record.html" class="flex-1 rounded-2xl bg-slate-100 text-slate-700 text-center py-4 font-semibold">取消</a>
                <a href="home.html" class="flex-[1.4] rounded-2xl bg-indigo-500 text-white text-center py-4 font-semibold shadow-lg shadow-indigo-200">保存睡眠记录</a>
            </div>
        </div>
    </div>
</body>
</html>
