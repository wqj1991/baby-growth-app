<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>相册管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-amber-50 font-sans">
    <div class="flex flex-col h-screen">
        <div class="bg-white/80 backdrop-blur-sm h-10 flex items-center justify-between px-4 text-sm font-medium text-gray-800 shadow-sm z-10">
            <div>10:48</div>
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-signal"></i>
                <i class="fa-solid fa-wifi"></i>
                <i class="fa-solid fa-battery-three-quarters fa-lg"></i>
            </div>
        </div>

        <main class="flex-1 overflow-y-auto custom-scrollbar pb-8">
            <header class="bg-gradient-to-br from-amber-400 via-orange-400 to-rose-400 px-5 pt-5 pb-8 text-white rounded-b-[32px] shadow-lg">
                <div class="flex items-center justify-between">
                    <a href="profile.html" class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center">
                        <i class="fa-solid fa-arrow-left"></i>
                    </a>
                    <span class="text-sm font-medium tracking-wide">媒体管理</span>
                    <button class="text-sm font-semibold">整理</button>
                </div>
                <h1 class="mt-6 text-3xl font-bold">相册管理</h1>
                <p class="mt-2 text-sm text-white/85">管理照片/视频分组、封面、可见范围与网盘同步状态。</p>
            </header>

            <section class="px-4 -mt-5 space-y-4">
                <div class="bg-white rounded-3xl shadow-sm p-4">
                    <div class="flex items-center justify-between">
                        <p class="text-sm font-semibold text-gray-900">空间概览</p>
                        <span class="text-xs font-semibold text-amber-600">共 1240 项</span>
                    </div>
                    <div class="mt-3 grid grid-cols-3 gap-2 text-center text-xs">
                        <div class="rounded-2xl bg-amber-50 py-3">
                            <p class="font-semibold text-amber-700">照片</p>
                            <p class="mt-1 text-gray-600">986</p>
                        </div>
                        <div class="rounded-2xl bg-orange-50 py-3">
                            <p class="font-semibold text-orange-700">视频</p>
                            <p class="mt-1 text-gray-600">254</p>
                        </div>
                        <div class="rounded-2xl bg-rose-50 py-3">
                            <p class="font-semibold text-rose-700">占用</p>
                            <p class="mt-1 text-gray-600">36.8 GB</p>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-3xl shadow-sm p-4">
                    <p class="text-sm font-semibold text-gray-900">相册分组</p>
                    <div class="mt-3 space-y-3 text-sm">
                        <div class="rounded-2xl bg-slate-50 px-4 py-3 flex items-center justify-between">
                            <div>
                                <p class="font-semibold text-gray-900">成长里程碑</p>
                                <p class="text-xs text-gray-500 mt-1">96 项 · 自动封面</p>
                            </div>
                            <i class="fa-solid fa-chevron-right text-gray-300"></i>
                        </div>
                        <div class="rounded-2xl bg-slate-50 px-4 py-3 flex items-center justify-between">
                            <div>
                                <p class="font-semibold text-gray-900">健康记录附件</p>
                                <p class="text-xs text-gray-500 mt-1">122 项 · 仅家庭可见</p>
                            </div>
                            <i class="fa-solid fa-chevron-right text-gray-300"></i>
                        </div>
                        <div class="rounded-2xl bg-slate-50 px-4 py-3 flex items-center justify-between">
                            <div>
                                <p class="font-semibold text-gray-900">日常抓拍</p>
                                <p class="text-xs text-gray-500 mt-1">1022 项 · 按月归档</p>
                            </div>
                            <i class="fa-solid fa-chevron-right text-gray-300"></i>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-3xl shadow-sm p-4">
                    <p class="text-sm font-semibold text-gray-900">媒体操作</p>
                    <div class="mt-3 space-y-3 text-sm">
                        <button class="w-full rounded-2xl bg-amber-50 border border-amber-100 px-4 py-3 flex items-center justify-between">
                            <span>批量移动到相册</span>
                            <i class="fa-solid fa-arrow-right text-amber-500"></i>
                        </button>
                        <button class="w-full rounded-2xl bg-amber-50 border border-amber-100 px-4 py-3 flex items-center justify-between">
                            <span>重复照片清理</span>
                            <i class="fa-solid fa-broom text-amber-500"></i>
                        </button>
                        <button class="w-full rounded-2xl bg-amber-50 border border-amber-100 px-4 py-3 flex items-center justify-between">
                            <span>同步失败重试</span>
                            <i class="fa-solid fa-rotate-right text-amber-500"></i>
                        </button>
                    </div>
                </div>
            </section>
        </main>

        <div class="px-4 pb-4 pt-3 bg-white border-t border-slate-200">
            <div class="flex gap-3">
                <a href="profile.html" class="flex-1 rounded-2xl bg-slate-100 text-slate-700 text-center py-4 font-semibold">返回我的</a>
                <a href="profile.html" class="flex-[1.4] rounded-2xl bg-amber-500 text-white text-center py-4 font-semibold shadow-lg shadow-amber-200">保存相册设置</a>
            </div>
        </div>
    </div>
</body>
</html>
