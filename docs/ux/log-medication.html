<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用药记录</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-sky-50 font-sans">
    <div class="flex flex-col h-screen">
        <div class="bg-white/80 backdrop-blur-sm h-10 flex items-center justify-between px-4 text-sm font-medium text-gray-800 shadow-sm z-10">
            <div>10:51</div>
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-signal"></i>
                <i class="fa-solid fa-wifi"></i>
                <i class="fa-solid fa-battery-three-quarters fa-lg"></i>
            </div>
        </div>
        <main class="flex-1 overflow-y-auto custom-scrollbar pb-8">
            <header class="bg-gradient-to-br from-sky-500 via-cyan-500 to-blue-500 px-5 pt-5 pb-8 text-white rounded-b-[32px] shadow-lg">
                <div class="flex items-center justify-between">
                    <a href="log-health-more.html" class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center"><i class="fa-solid fa-arrow-left"></i></a>
                    <span class="text-sm font-medium tracking-wide">健康记录</span>
                    <button class="text-sm font-semibold">提醒</button>
                </div>
                <h1 class="mt-6 text-3xl font-bold">用药记录</h1>
                <p class="mt-2 text-sm text-white/85">记录药物名称、剂量、频次和服用后的状态，避免重复或漏服。</p>
            </header>
            <section class="px-4 -mt-5 space-y-4">
                <div class="bg-white rounded-3xl shadow-sm p-4">
                    <p class="text-sm font-semibold text-gray-900">药物信息</p>
                    <div class="mt-3 space-y-3 text-sm">
                        <div class="rounded-2xl bg-sky-50 border border-sky-100 px-4 py-4">
                            <p class="text-xs text-sky-600">药名</p>
                            <p class="mt-1 font-semibold text-gray-900">布洛芬混悬液</p>
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div class="rounded-2xl bg-slate-50 px-4 py-4">
                                <p class="text-xs text-gray-400">剂量</p>
                                <p class="mt-1 font-semibold text-gray-900">3 ml</p>
                            </div>
                            <div class="rounded-2xl bg-slate-50 px-4 py-4">
                                <p class="text-xs text-gray-400">服用时间</p>
                                <p class="mt-1 font-semibold text-gray-900">09:30</p>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="bg-white rounded-3xl shadow-sm p-4">
                    <div class="flex items-center justify-between">
                        <p class="text-sm font-semibold text-gray-900">用药方式</p>
                        <span class="text-xs text-sky-600 font-medium">按医嘱执行</span>
                    </div>
                    <div class="mt-3 grid grid-cols-3 gap-3 text-sm">
                        <button class="rounded-2xl bg-sky-500 text-white py-3 font-semibold">口服</button>
                        <button class="rounded-2xl bg-slate-100 text-slate-600 py-3 font-semibold">外用</button>
                        <button class="rounded-2xl bg-slate-100 text-slate-600 py-3 font-semibold">雾化</button>
                    </div>
                    <div class="mt-3 rounded-2xl bg-sky-50 px-4 py-3 text-xs text-sky-700">下次提醒：13:30，可同步给家庭成员。</div>
                </div>
                <div class="bg-white rounded-3xl shadow-sm p-4">
                    <p class="text-sm font-semibold text-gray-900">用药后状态</p>
                    <div class="mt-3 flex flex-wrap gap-2 text-sm">
                        <button class="px-4 py-2 rounded-full bg-emerald-100 text-emerald-700 font-medium">退热中</button>
                        <button class="px-4 py-2 rounded-full bg-slate-100 text-slate-600 font-medium">无明显不适</button>
                        <button class="px-4 py-2 rounded-full bg-slate-100 text-slate-600 font-medium">食欲一般</button>
                    </div>
                    <div class="mt-4 rounded-2xl border border-dashed border-slate-200 px-4 py-4 text-sm text-gray-400">备注：是否呕吐、是否吐药、是否需再次复测体温</div>
                </div>
            </section>
        </main>
        <div class="px-4 pb-4 pt-3 bg-white border-t border-slate-200">
            <div class="flex gap-3">
                <a href="log-health-more.html" class="flex-1 rounded-2xl bg-slate-100 text-slate-700 text-center py-4 font-semibold">取消</a>
                <a href="home.html" class="flex-[1.4] rounded-2xl bg-sky-500 text-white text-center py-4 font-semibold shadow-lg shadow-sky-200">保存用药记录</a>
            </div>
        </div>
    </div>
</body>
</html>
