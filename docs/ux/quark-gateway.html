<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>夸克网关</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-sky-50 font-sans">
    <div class="flex flex-col h-screen">
        <div class="bg-white/80 backdrop-blur-sm h-10 flex items-center justify-between px-4 text-sm font-medium text-gray-800 shadow-sm z-10">
            <div>10:45</div>
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-signal"></i>
                <i class="fa-solid fa-wifi"></i>
                <i class="fa-solid fa-battery-three-quarters fa-lg"></i>
            </div>
        </div>

        <main class="flex-1 overflow-y-auto custom-scrollbar pb-8">
            <header class="bg-gradient-to-br from-sky-500 via-cyan-500 to-blue-600 px-5 pt-5 pb-8 text-white rounded-b-[32px] shadow-lg">
                <div class="flex items-center justify-between">
                    <a href="profile.html" class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center">
                        <i class="fa-solid fa-arrow-left"></i>
                    </a>
                    <span class="text-sm font-medium tracking-wide">云端连接</span>
                    <button class="text-sm font-semibold">保存</button>
                </div>
                <h1 class="mt-6 text-3xl font-bold">夸克网关</h1>
                <p class="mt-2 text-sm text-white/85">管理夸克云端连接、同步策略、加密与空间映射。</p>
            </header>

            <section class="px-4 -mt-5 space-y-4">
                <div class="bg-white rounded-3xl shadow-sm p-4">
                    <div class="flex items-center justify-between">
                        <p class="text-sm font-semibold text-gray-900">连接状态</p>
                        <span class="text-xs font-semibold text-emerald-600">已连接</span>
                    </div>
                    <div class="mt-3 rounded-2xl bg-sky-50 border border-sky-100 p-4 text-sm">
                        <div class="flex items-center justify-between">
                            <span class="text-gray-500">账号</span>
                            <span class="font-semibold text-gray-900">baobao_family@quark.cn</span>
                        </div>
                        <div class="flex items-center justify-between mt-2">
                            <span class="text-gray-500">最后握手</span>
                            <span class="font-semibold text-gray-900">今天 10:31</span>
                        </div>
                        <div class="mt-3 flex gap-2">
                            <button class="flex-1 rounded-xl bg-white border border-sky-200 py-2 text-sky-700 font-semibold">重新鉴权</button>
                            <button class="flex-1 rounded-xl bg-white border border-sky-200 py-2 text-sky-700 font-semibold">检测连通性</button>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-3xl shadow-sm p-4">
                    <p class="text-sm font-semibold text-gray-900">目录映射</p>
                    <div class="mt-3 space-y-3 text-sm">
                        <div class="rounded-2xl bg-slate-50 px-4 py-3 flex items-center justify-between">
                            <span class="text-gray-500">时间轴媒体目录</span>
                            <span class="font-semibold text-gray-900">/Baby/Media</span>
                        </div>
                        <div class="rounded-2xl bg-slate-50 px-4 py-3 flex items-center justify-between">
                            <span class="text-gray-500">日志目录</span>
                            <span class="font-semibold text-gray-900">/Baby/Logs</span>
                        </div>
                        <div class="rounded-2xl bg-slate-50 px-4 py-3 flex items-center justify-between">
                            <span class="text-gray-500">配置目录</span>
                            <span class="font-semibold text-gray-900">/Baby/Config</span>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-3xl shadow-sm p-4">
                    <div class="flex items-center justify-between">
                        <p class="text-sm font-semibold text-gray-900">同步策略</p>
                        <span class="text-xs text-sky-600 font-semibold">按产品规则</span>
                    </div>
                    <div class="mt-3 space-y-3 text-sm">
                        <div class="rounded-2xl bg-slate-50 px-4 py-3 flex items-center justify-between">
                            <span>App 启动自动同步</span>
                            <i class="fa-solid fa-toggle-on text-emerald-500 text-2xl"></i>
                        </div>
                        <div class="rounded-2xl bg-slate-50 px-4 py-3 flex items-center justify-between">
                            <span>下拉刷新触发同步</span>
                            <i class="fa-solid fa-toggle-on text-emerald-500 text-2xl"></i>
                        </div>
                        <div class="rounded-2xl bg-slate-50 px-4 py-3 flex items-center justify-between">
                            <span>后台每 10 分钟轮询</span>
                            <i class="fa-solid fa-toggle-on text-emerald-500 text-2xl"></i>
                        </div>
                        <div class="rounded-2xl bg-slate-50 px-4 py-3 flex items-center justify-between">
                            <span>冲突策略</span>
                            <span class="font-semibold text-gray-900">LWW</span>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-3xl shadow-sm p-4">
                    <p class="text-sm font-semibold text-gray-900">安全与缓存</p>
                    <div class="mt-3 space-y-3 text-sm">
                        <div class="rounded-2xl bg-slate-50 px-4 py-3 flex items-center justify-between">
                            <span>日志/配置加密上传</span>
                            <i class="fa-solid fa-toggle-on text-emerald-500 text-2xl"></i>
                        </div>
                        <div class="rounded-2xl bg-slate-50 px-4 py-3 flex items-center justify-between">
                            <span>预览缓存上限</span>
                            <span class="font-semibold text-gray-900">2 GB</span>
                        </div>
                        <div class="rounded-2xl bg-slate-50 px-4 py-3 flex items-center justify-between">
                            <span>缓存有效期</span>
                            <span class="font-semibold text-gray-900">7 天</span>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <div class="px-4 pb-4 pt-3 bg-white border-t border-slate-200">
            <div class="flex gap-3">
                <a href="profile.html" class="flex-1 rounded-2xl bg-slate-100 text-slate-700 text-center py-4 font-semibold">返回我的</a>
                <a href="profile.html" class="flex-[1.4] rounded-2xl bg-sky-500 text-white text-center py-4 font-semibold shadow-lg shadow-sky-200">保存网关配置</a>
            </div>
        </div>
    </div>
</body>
</html>
