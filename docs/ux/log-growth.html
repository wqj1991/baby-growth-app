<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>身高体重记录</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-emerald-50 font-sans">
    <div class="flex flex-col h-screen">
        <div class="bg-white/80 backdrop-blur-sm h-10 flex items-center justify-between px-4 text-sm font-medium text-gray-800 shadow-sm z-10">
            <div>10:39</div>
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-signal"></i>
                <i class="fa-solid fa-wifi"></i>
                <i class="fa-solid fa-battery-full fa-lg"></i>
            </div>
        </div>

        <main class="flex-1 overflow-y-auto custom-scrollbar pb-8">
            <header class="bg-gradient-to-br from-emerald-500 via-teal-500 to-cyan-500 px-5 pt-5 pb-8 text-white rounded-b-[32px] shadow-lg">
                <div class="flex items-center justify-between">
                    <a href="record.html" class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center">
                        <i class="fa-solid fa-arrow-left"></i>
                    </a>
                    <span class="text-sm font-medium tracking-wide">成长测量</span>
                    <button class="text-sm font-semibold">图表</button>
                </div>
                <h1 class="mt-6 text-3xl font-bold">身高 / 体重</h1>
                <p class="mt-2 text-sm text-white/85">记录关键成长指标，并和上一次测量做直观对比。</p>
            </header>

            <section class="px-4 -mt-5 space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-white rounded-3xl shadow-sm p-4">
                        <p class="text-sm font-semibold text-gray-900">身高</p>
                        <div class="mt-4 rounded-3xl bg-emerald-50 p-4 text-center border border-emerald-100">
                            <p class="text-4xl font-bold text-emerald-700">78.5</p>
                            <p class="text-sm text-emerald-600 mt-1">cm</p>
                        </div>
                        <div class="mt-3 text-xs text-gray-500">较上次 +0.8 cm</div>
                    </div>
                    <div class="bg-white rounded-3xl shadow-sm p-4">
                        <p class="text-sm font-semibold text-gray-900">体重</p>
                        <div class="mt-4 rounded-3xl bg-cyan-50 p-4 text-center border border-cyan-100">
                            <p class="text-4xl font-bold text-cyan-700">10.6</p>
                            <p class="text-sm text-cyan-600 mt-1">kg</p>
                        </div>
                        <div class="mt-3 text-xs text-gray-500">较上次 +0.3 kg</div>
                    </div>
                </div>

                <div class="bg-white rounded-3xl shadow-sm p-4">
                    <div class="flex items-center justify-between">
                        <p class="text-sm font-semibold text-gray-900">本次测量状态</p>
                        <span class="text-xs text-emerald-600 font-medium">建议每周固定时间测量</span>
                    </div>
                    <div class="mt-3 flex flex-wrap gap-2 text-sm">
                        <button class="px-4 py-2 rounded-full bg-emerald-100 text-emerald-700 font-medium">饭前</button>
                        <button class="px-4 py-2 rounded-full bg-slate-100 text-slate-600 font-medium">饭后</button>
                        <button class="px-4 py-2 rounded-full bg-slate-100 text-slate-600 font-medium">刚睡醒</button>
                        <button class="px-4 py-2 rounded-full bg-slate-100 text-slate-600 font-medium">情绪稳定</button>
                    </div>
                </div>

                <div class="bg-white rounded-3xl shadow-sm p-4">
                    <p class="text-sm font-semibold text-gray-900">成长趋势</p>
                    <div class="mt-4 rounded-3xl bg-slate-900 p-4 text-white">
                        <div class="flex items-end justify-between h-28 gap-2">
                            <div class="flex-1 rounded-t-2xl bg-emerald-300/50 h-14"></div>
                            <div class="flex-1 rounded-t-2xl bg-emerald-300/60 h-16"></div>
                            <div class="flex-1 rounded-t-2xl bg-emerald-300/70 h-20"></div>
                            <div class="flex-1 rounded-t-2xl bg-emerald-300/80 h-24"></div>
                            <div class="flex-1 rounded-t-2xl bg-emerald-300 h-28"></div>
                        </div>
                        <div class="mt-3 flex justify-between text-[11px] text-white/60">
                            <span>12月</span>
                            <span>1月</span>
                            <span>2月</span>
                            <span>3月</span>
                            <span>4月</span>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-3xl shadow-sm p-4">
                    <p class="text-sm font-semibold text-gray-900">备注</p>
                    <div class="mt-3 rounded-2xl border border-dashed border-slate-200 px-4 py-6 text-sm text-gray-400">补充测量工具、姿势、是否有生病恢复期等</div>
                </div>
            </section>
        </main>

        <div class="px-4 pb-4 pt-3 bg-white border-t border-slate-200">
            <div class="flex gap-3">
                <a href="record.html" class="flex-1 rounded-2xl bg-slate-100 text-slate-700 text-center py-4 font-semibold">取消</a>
                <a href="home.html" class="flex-[1.4] rounded-2xl bg-emerald-500 text-white text-center py-4 font-semibold shadow-lg shadow-emerald-200">保存成长记录</a>
            </div>
        </div>
    </div>
</body>
</html>
