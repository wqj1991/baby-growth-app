<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>就诊记录</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-violet-50 font-sans">
    <div class="flex flex-col h-screen">
        <div class="bg-white/80 backdrop-blur-sm h-10 flex items-center justify-between px-4 text-sm font-medium text-gray-800 shadow-sm z-10">
            <div>10:54</div>
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-signal"></i>
                <i class="fa-solid fa-wifi"></i>
                <i class="fa-solid fa-battery-full fa-lg"></i>
            </div>
        </div>
        <main class="flex-1 overflow-y-auto custom-scrollbar pb-8">
            <header class="bg-gradient-to-br from-violet-500 via-fuchsia-500 to-purple-500 px-5 pt-5 pb-8 text-white rounded-b-[32px] shadow-lg">
                <div class="flex items-center justify-between">
                    <a href="log-health-more.html" class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center"><i class="fa-solid fa-arrow-left"></i></a>
                    <span class="text-sm font-medium tracking-wide">健康记录</span>
                    <button class="text-sm font-semibold">上传单据</button>
                </div>
                <h1 class="mt-6 text-3xl font-bold">就诊记录</h1>
                <p class="mt-2 text-sm text-white/85">记录医院、科室、医生建议和检查结果，方便后续复查和家庭共享。</p>
            </header>
            <section class="px-4 -mt-5 space-y-4">
                <div class="bg-white rounded-3xl shadow-sm p-4">
                    <p class="text-sm font-semibold text-gray-900">就诊信息</p>
                    <div class="mt-3 grid grid-cols-2 gap-3 text-sm">
                        <div class="rounded-2xl bg-violet-50 border border-violet-100 px-4 py-4">
                            <p class="text-xs text-violet-600">医院</p>
                            <p class="mt-1 font-semibold text-gray-900">儿童医院</p>
                        </div>
                        <div class="rounded-2xl bg-slate-50 px-4 py-4">
                            <p class="text-xs text-gray-400">科室</p>
                            <p class="mt-1 font-semibold text-gray-900">儿科门诊</p>
                        </div>
                    </div>
                    <div class="mt-3 rounded-2xl bg-slate-50 px-4 py-4 text-sm">
                        <p class="text-xs text-gray-400">医生结论</p>
                        <p class="mt-1 font-semibold text-gray-900">上呼吸道感染，建议继续观察体温并按时用药。</p>
                    </div>
                </div>
                <div class="bg-white rounded-3xl shadow-sm p-4">
                    <p class="text-sm font-semibold text-gray-900">处置与复查</p>
                    <div class="mt-3 flex flex-wrap gap-2 text-sm">
                        <button class="px-4 py-2 rounded-full bg-violet-100 text-violet-700 font-medium">已开药</button>
                        <button class="px-4 py-2 rounded-full bg-violet-100 text-violet-700 font-medium">3 天后复诊</button>
                        <button class="px-4 py-2 rounded-full bg-slate-100 text-slate-600 font-medium">多喝水</button>
                    </div>
                    <div class="mt-4 rounded-2xl border border-dashed border-slate-200 px-4 py-4 text-sm text-gray-400">备注：检查单、化验结果、医生口头建议等</div>
                </div>
            </section>
        </main>
        <div class="px-4 pb-4 pt-3 bg-white border-t border-slate-200">
            <div class="flex gap-3">
                <a href="log-health-more.html" class="flex-1 rounded-2xl bg-slate-100 text-slate-700 text-center py-4 font-semibold">取消</a>
                <a href="home.html" class="flex-[1.4] rounded-2xl bg-violet-500 text-white text-center py-4 font-semibold shadow-lg shadow-violet-200">保存就诊记录</a>
            </div>
        </div>
    </div>
</body>
</html>
