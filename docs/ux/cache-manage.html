<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>缓存管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-teal-50 font-sans">
    <div class="flex flex-col h-screen">
        <div class="bg-white/80 backdrop-blur-sm h-10 flex items-center justify-between px-4 text-sm font-medium text-gray-800 shadow-sm z-10">
            <div>10:49</div>
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-signal"></i>
                <i class="fa-solid fa-wifi"></i>
                <i class="fa-solid fa-battery-full fa-lg"></i>
            </div>
        </div>

        <main class="flex-1 overflow-y-auto custom-scrollbar pb-8">
            <header class="bg-gradient-to-br from-teal-500 via-cyan-500 to-sky-500 px-5 pt-5 pb-8 text-white rounded-b-[32px] shadow-lg">
                <div class="flex items-center justify-between">
                    <a href="profile.html" class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center">
                        <i class="fa-solid fa-arrow-left"></i>
                    </a>
                    <span class="text-sm font-medium tracking-wide">本地存储</span>
                    <button class="text-sm font-semibold">优化</button>
                </div>
                <h1 class="mt-6 text-3xl font-bold">缓存管理</h1>
                <p class="mt-2 text-sm text-white/85">管理预览缓存、自动清理规则与离线可用内容。</p>
            </header>

            <section class="px-4 -mt-5 space-y-4">
                <div class="bg-white rounded-3xl shadow-sm p-4">
                    <div class="flex items-center justify-between">
                        <p class="text-sm font-semibold text-gray-900">缓存使用</p>
                        <span class="text-xs font-semibold text-teal-600">1.36 / 2.00 GB</span>
                    </div>
                    <div class="mt-3 h-3 bg-teal-100 rounded-full overflow-hidden">
                        <div class="h-full w-[68%] bg-teal-500 rounded-full"></div>
                    </div>
                    <div class="mt-3 grid grid-cols-3 gap-2 text-center text-xs">
                        <div class="rounded-2xl bg-teal-50 py-2">
                            <p class="font-semibold text-teal-700">图片预览</p>
                            <p class="mt-1 text-gray-600">0.72 GB</p>
                        </div>
                        <div class="rounded-2xl bg-cyan-50 py-2">
                            <p class="font-semibold text-cyan-700">视频封面</p>
                            <p class="mt-1 text-gray-600">0.48 GB</p>
                        </div>
                        <div class="rounded-2xl bg-sky-50 py-2">
                            <p class="font-semibold text-sky-700">元数据</p>
                            <p class="mt-1 text-gray-600">0.16 GB</p>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-3xl shadow-sm p-4">
                    <p class="text-sm font-semibold text-gray-900">清理策略</p>
                    <div class="mt-3 space-y-3 text-sm">
                        <div class="rounded-2xl bg-slate-50 px-4 py-3 flex items-center justify-between">
                            <span>超过 7 天自动清理</span>
                            <i class="fa-solid fa-toggle-on text-emerald-500 text-2xl"></i>
                        </div>
                        <div class="rounded-2xl bg-slate-50 px-4 py-3 flex items-center justify-between">
                            <span>低电量暂停预加载</span>
                            <i class="fa-solid fa-toggle-on text-emerald-500 text-2xl"></i>
                        </div>
                        <div class="rounded-2xl bg-slate-50 px-4 py-3 flex items-center justify-between">
                            <span>仅 Wi-Fi 预热封面</span>
                            <i class="fa-solid fa-toggle-on text-emerald-500 text-2xl"></i>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-3xl shadow-sm p-4">
                    <p class="text-sm font-semibold text-gray-900">手动操作</p>
                    <div class="mt-3 space-y-3 text-sm">
                        <button class="w-full rounded-2xl bg-teal-50 border border-teal-100 px-4 py-3 flex items-center justify-between">
                            <span>清理过期缓存</span>
                            <i class="fa-solid fa-trash-can text-teal-500"></i>
                        </button>
                        <button class="w-full rounded-2xl bg-teal-50 border border-teal-100 px-4 py-3 flex items-center justify-between">
                            <span>一键释放 500MB</span>
                            <i class="fa-solid fa-broom text-teal-500"></i>
                        </button>
                        <button class="w-full rounded-2xl bg-teal-50 border border-teal-100 px-4 py-3 flex items-center justify-between">
                            <span>重建本地索引</span>
                            <i class="fa-solid fa-database text-teal-500"></i>
                        </button>
                    </div>
                </div>
            </section>
        </main>

        <div class="px-4 pb-4 pt-3 bg-white border-t border-slate-200">
            <div class="flex gap-3">
                <a href="profile.html" class="flex-1 rounded-2xl bg-slate-100 text-slate-700 text-center py-4 font-semibold">返回我的</a>
                <a href="profile.html" class="flex-[1.4] rounded-2xl bg-teal-500 text-white text-center py-4 font-semibold shadow-lg shadow-teal-200">保存缓存策略</a>
            </div>
        </div>
    </div>
</body>
</html>
