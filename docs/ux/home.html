<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>首页</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-gray-50 font-sans">
    <div class="flex flex-col h-screen">
        <!-- Top Status Bar -->
        <div class="bg-white/80 backdrop-blur-sm h-10 flex items-center justify-between px-4 text-sm font-medium text-gray-800 shadow-sm z-10">
            <div>10:24</div>
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-signal"></i>
                <i class="fa-solid fa-wifi"></i>
                <i class="fa-solid fa-battery-three-quarters fa-lg"></i>
            </div>
        </div>

        <!-- Main Content -->
        <main class="flex-1 overflow-y-auto custom-scrollbar pb-24">
            <!-- Header -->
            <header class="sticky top-0 bg-white/80 backdrop-blur-sm z-10 p-4">
                <div class="flex justify-between items-center">
                    <div>
                        <h1 class="text-2xl font-bold text-gray-900">宝宝的动态</h1>
                        <p class="text-sm text-gray-500">1岁 8个月 14天</p>
                    </div>
                    <div class="flex items-center gap-4">
                        <i class="fa-solid fa-magnifying-glass text-xl text-gray-600"></i>
                        <i class="fa-solid fa-camera text-xl text-gray-600"></i>
                    </div>
                </div>
                 <!-- Quick Stats -->
                <div class="mt-4 grid grid-cols-3 gap-2 text-center text-xs">
                    <a href="stats.html" class="bg-blue-50 rounded-lg p-2 block hover:bg-blue-100 transition">
                        <p class="font-semibold text-blue-800">喂养</p>
                        <p class="text-gray-600">今天 5次</p>
                    </a>
                    <a href="stats.html" class="bg-green-50 rounded-lg p-2 block hover:bg-green-100 transition">
                        <p class="font-semibold text-green-800">睡眠</p>
                        <p class="text-gray-600">共 10.5h</p>
                    </a>
                    <a href="stats.html" class="bg-yellow-50 rounded-lg p-2 block hover:bg-yellow-100 transition">
                        <p class="font-semibold text-yellow-800">换片</p>
                        <p class="text-gray-600">今天 6次</p>
                    </a>
                </div>
            </header>

            <!-- Timeline -->
            <div class="p-4 space-y-6">
                <!-- Timeline Item 1: Photo -->
                <div class="bg-white rounded-xl shadow-md overflow-hidden">
                    <div class="p-4">
                        <div class="flex items-center space-x-3">
                            <img class="h-10 w-10 rounded-full object-cover" src="assets/images/mom-avatar.jpg" alt="妈妈">
                            <div>
                                <p class="text-sm font-semibold text-gray-800">妈妈</p>
                                <p class="text-xs text-gray-500">2小时前</p>
                            </div>
                        </div>
                        <p class="mt-3 block text-gray-700 text-base">今天天气真好，带宝宝去公园玩啦！☀️</p>
                    </div>
                    <a href="timeline-photo-detail.html" class="block">
                        <img class="w-full h-auto" src="assets/images/baby-park.jpg" alt="宝宝在公园">
                    </a>
                    <div class="p-4 flex justify-between items-center text-gray-600">
                        <div class="flex gap-4">
                            <a href="#" class="flex items-center gap-1 hover:text-pink-500 transition"><i class="fa-regular fa-heart"></i> 12</a>
                            <a href="#" class="flex items-center gap-1 hover:text-blue-500 transition"><i class="fa-regular fa-comment"></i> 3</a>
                        </div>
                        <div>
                             <a href="timeline-photo-manage.html" class="text-blue-500 font-semibold flex items-center gap-1 hover:underline"><i class="fa-solid fa-eye"></i> 查看详情</a>
                        </div>
                    </div>
                </div>

                <!-- Timeline Item 2: Video -->
                <div class="bg-white rounded-xl shadow-md overflow-hidden">
                    <div class="p-4">
                        <div class="flex items-center space-x-3">
                            <img class="h-10 w-10 rounded-full object-cover" src="assets/images/dad-avatar.jpg" alt="爸爸">
                            <div>
                                <p class="text-sm font-semibold text-gray-800">爸爸</p>
                                <p class="text-xs text-gray-500">5小时前</p>
                            </div>
                        </div>
                        <p class="mt-3 block text-gray-700 text-base">宝宝第一次自己走路，必须记录下来！</p>
                    </div>
                    <a href="timeline-video-detail.html" class="relative block group">
                        <img class="w-full h-auto" src="assets/images/baby-walking.jpg" alt="宝宝走路视频">
                        <div class="absolute inset-0 flex items-center justify-center bg-black/30 transition-opacity group-hover:opacity-75">
                            <i class="fa-solid fa-play text-white text-5xl transform transition-transform group-hover:scale-110"></i>
                        </div>
                    </a>
                    <div class="p-4 flex justify-between items-center text-gray-600">
                        <div class="flex gap-4">
                            <a href="#" class="flex items-center gap-1 hover:text-pink-500 transition"><i class="fa-regular fa-heart"></i> 25</a>
                            <a href="#" class="flex items-center gap-1 hover:text-blue-500 transition"><i class="fa-regular fa-comment"></i> 8</a>
                        </div>
                        <div>
                             <a href="timeline-video-manage.html" class="text-blue-500 font-semibold flex items-center gap-1 hover:underline"><i class="fa-solid fa-eye"></i> 查看详情</a>
                        </div>
                    </div>
                </div>

                 <!-- Timeline Item 3: Log -->
                <div class="bg-white rounded-xl shadow-md p-4">
                    <div class="flex items-center space-x-3">
                        <img class="h-10 w-10 rounded-full object-cover" src="assets/images/mom-avatar.jpg" alt="妈妈">
                        <div>
                            <p class="text-sm font-semibold text-gray-800">妈妈</p>
                            <p class="text-xs text-gray-500">8小时前</p>
                        </div>
                    </div>
                    <a href="log-feeding.html" class="mt-3 flex items-center gap-4 bg-indigo-50 p-3 rounded-lg hover:bg-indigo-100 transition">
                        <i class="fa-solid fa-bottle-droplet text-indigo-500 text-2xl"></i>
                        <div>
                            <p class="font-semibold text-gray-800">喂奶记录</p>
                            <p class="text-sm text-gray-600">奶粉 180ml</p>
                        </div>
                    </a>
                </div>
            </div>
        </main>

        <!-- Bottom Tab Bar -->
        <nav class="absolute bottom-0 left-0 right-0 bg-white/80 backdrop-blur-sm h-20 flex justify-around items-center text-gray-500 border-t border-gray-200 rounded-b-2xl">
            <a href="home.html" class="text-center text-blue-500 transition-colors hover:text-blue-600">
                <i class="fa-solid fa-house fa-lg"></i>
                <span class="block text-xs font-medium mt-1">首页</span>
            </a>
            <a href="record.html" class="text-center group">
                <div class="w-16 h-16 -mt-10 bg-blue-500 rounded-full flex items-center justify-center text-white shadow-lg transform transition-transform group-hover:scale-110">
                    <i class="fa-solid fa-plus fa-2x"></i>
                </div>
            </a>
            <a href="profile.html" class="text-center transition-colors hover:text-blue-600">
                <i class="fa-solid fa-user fa-lg"></i>
                <span class="block text-xs font-medium mt-1">我的</span>
            </a>
        </nav>
    </div>
</body>
</html>
