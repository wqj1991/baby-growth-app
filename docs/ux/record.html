<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>快速记录</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-gray-50 font-sans">
    <div class="flex flex-col h-screen">
        <!-- Top Status Bar -->
        <div class="bg-white/80 backdrop-blur-sm h-10 flex items-center justify-between px-4 text-sm font-medium text-gray-800 shadow-sm z-10">
            <div>10:30</div>
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-signal"></i>
                <i class="fa-solid fa-wifi"></i>
                <i class="fa-solid fa-battery-full fa-lg"></i>
            </div>
        </div>

        <!-- Main Content -->
        <main class="flex-1 overflow-y-auto custom-scrollbar pb-24 p-4">
            <header class="text-center mb-6">
                <h1 class="text-2xl font-bold text-gray-900">记录宝宝的今天</h1>
                <p class="text-sm text-gray-500">选择一种方式开始记录吧</p>
            </header>

            <!-- Action Grid -->
            <div class="grid grid-cols-2 gap-4">
                <!-- Camera -->
                <a href="#" class="aspect-square bg-gradient-to-br from-purple-400 to-indigo-500 rounded-2xl flex flex-col items-center justify-center text-white shadow-lg transform transition-transform hover:scale-105">
                    <i class="fa-solid fa-camera fa-3x"></i>
                    <p class="mt-2 font-semibold">拍照/录像</p>
                    <p class="text-xs opacity-80">同步到网盘</p>
                </a>

                <!-- Upload -->
                <a href="#" class="aspect-square bg-gradient-to-br from-teal-400 to-cyan-500 rounded-2xl flex flex-col items-center justify-center text-white shadow-lg transform transition-transform hover:scale-105">
                    <i class="fa-solid fa-arrow-up-from-bracket fa-3x"></i>
                    <p class="mt-2 font-semibold">本地上传</p>
                    <p class="text-xs opacity-80">仅备份到网盘</p>
                </a>
            </div>

            <!-- Divider -->
            <div class="my-8 text-center text-sm text-gray-400 font-semibold">
                <p>或快速记录日常</p>
            </div>

            <!-- Quick Log Buttons -->
            <div class="space-y-4">
                <a href="log-feeding.html" class="w-full flex items-center gap-4 p-4 bg-white rounded-xl shadow-md transition-shadow hover:shadow-lg">
                    <i class="fa-solid fa-bottle-droplet text-blue-500 text-2xl w-8 text-center"></i>
                    <span class="font-semibold text-gray-800">喂养</span>
                    <i class="fa-solid fa-chevron-right text-gray-400 ml-auto"></i>
                </a>
                <a href="log-potty.html" class="w-full flex items-center gap-4 p-4 bg-white rounded-xl shadow-md transition-shadow hover:shadow-lg">
                    <i class="fa-solid fa-poo text-amber-600 text-2xl w-8 text-center"></i>
                    <span class="font-semibold text-gray-800">大小便</span>
                    <i class="fa-solid fa-chevron-right text-gray-400 ml-auto"></i>
                </a>
                <a href="log-sleep.html" class="w-full flex items-center gap-4 p-4 bg-white rounded-xl shadow-md transition-shadow hover:shadow-lg">
                    <i class="fa-solid fa-bed text-indigo-500 text-2xl w-8 text-center"></i>
                    <span class="font-semibold text-gray-800">睡眠</span>
                    <i class="fa-solid fa-chevron-right text-gray-400 ml-auto"></i>
                </a>
                 <a href="log-growth.html" class="w-full flex items-center gap-4 p-4 bg-white rounded-xl shadow-md transition-shadow hover:shadow-lg">
                    <i class="fa-solid fa-ruler-combined text-green-500 text-2xl w-8 text-center"></i>
                    <span class="font-semibold text-gray-800">身高/体重</span>
                    <i class="fa-solid fa-chevron-right text-gray-400 ml-auto"></i>
                </a>
                <a href="log-health-more.html" class="w-full flex items-center gap-4 p-4 bg-white rounded-xl shadow-md transition-shadow hover:shadow-lg">
                    <i class="fa-solid fa-notes-medical text-red-500 text-2xl w-8 text-center"></i>
                    <span class="font-semibold text-gray-800">更多健康记录</span>
                    <i class="fa-solid fa-chevron-right text-gray-400 ml-auto"></i>
                </a>
            </div>
        </main>

        <!-- Bottom Tab Bar -->
        <nav class="absolute bottom-0 left-0 right-0 bg-white/80 backdrop-blur-sm h-20 flex justify-around items-center text-gray-500 border-t border-gray-200 rounded-b-2xl">
            <a href="home.html" class="text-center transition-colors hover:text-blue-600">
                <i class="fa-solid fa-house fa-lg"></i>
                <span class="block text-xs font-medium mt-1">首页</span>
            </a>
            <a href="record.html" class="text-center text-blue-500 group">
                <div class="w-16 h-16 -mt-10 bg-blue-500 rounded-full flex items-center justify-center text-white shadow-lg transform transition-transform group-hover:scale-110">
                    <i class="fa-solid fa-plus fa-2x"></i>
                </div>
            </a>
            <a href="profile.html" class="text-center transition-colors hover:text-blue-600">
                <i class="fa-solid fa-user fa-lg"></i>
                <span class="block text-xs font-medium mt-1">我的</span>
            </a>
        </nav>
    </div>
</body>
</html>
