<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>消息管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-indigo-50 font-sans">
    <div class="flex flex-col h-screen">
        <div class="bg-white/80 backdrop-blur-sm h-10 flex items-center justify-between px-4 text-sm font-medium text-gray-800 shadow-sm z-10">
            <div>10:53</div>
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-signal"></i>
                <i class="fa-solid fa-wifi"></i>
                <i class="fa-solid fa-battery-three-quarters fa-lg"></i>
            </div>
        </div>

        <main class="flex-1 overflow-y-auto custom-scrollbar pb-8">
            <header class="bg-gradient-to-br from-indigo-500 via-violet-500 to-fuchsia-500 px-5 pt-5 pb-8 text-white rounded-b-[32px] shadow-lg">
                <div class="flex items-center justify-between">
                    <a href="profile.html" class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center"><i class="fa-solid fa-arrow-left"></i></a>
                    <span class="text-sm font-medium tracking-wide">通知中心</span>
                    <button class="text-sm font-semibold">静默时段</button>
                </div>
                <h1 class="mt-6 text-3xl font-bold">消息管理</h1>
                <p class="mt-2 text-sm text-white/85">按类型配置推送强度，避免打扰，同时保留关键提醒。</p>
            </header>

            <section class="px-4 -mt-5 space-y-4">
                <div class="bg-white rounded-3xl shadow-sm p-4">
                    <p class="text-sm font-semibold text-gray-900">关键提醒</p>
                    <div class="mt-3 space-y-3 text-sm">
                        <div class="rounded-2xl bg-indigo-50 border border-indigo-100 px-4 py-3 flex items-center justify-between">
                            <div>
                                <p class="font-semibold text-gray-900">健康异常提醒</p>
                                <p class="text-xs text-gray-500 mt-1">发热、用药冲突、持续症状</p>
                            </div>
                            <i class="fa-solid fa-toggle-on text-emerald-500 text-2xl"></i>
                        </div>
                        <div class="rounded-2xl bg-indigo-50 border border-indigo-100 px-4 py-3 flex items-center justify-between">
                            <div>
                                <p class="font-semibold text-gray-900">同步失败告警</p>
                                <p class="text-xs text-gray-500 mt-1">云端上传失败或冲突未解决</p>
                            </div>
                            <i class="fa-solid fa-toggle-on text-emerald-500 text-2xl"></i>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-3xl shadow-sm p-4">
                    <p class="text-sm font-semibold text-gray-900">日常消息</p>
                    <div class="mt-3 space-y-3 text-sm">
                        <div class="rounded-2xl bg-slate-50 px-4 py-3 flex items-center justify-between">
                            <span>家庭评论与点赞</span>
                            <i class="fa-solid fa-toggle-on text-emerald-500 text-2xl"></i>
                        </div>
                        <div class="rounded-2xl bg-slate-50 px-4 py-3 flex items-center justify-between">
                            <span>喂养/睡眠建议提醒</span>
                            <i class="fa-solid fa-toggle-off text-slate-300 text-2xl"></i>
                        </div>
                        <div class="rounded-2xl bg-slate-50 px-4 py-3 flex items-center justify-between">
                            <span>每周成长报告推送</span>
                            <i class="fa-solid fa-toggle-on text-emerald-500 text-2xl"></i>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-3xl shadow-sm p-4">
                    <div class="flex items-center justify-between">
                        <p class="text-sm font-semibold text-gray-900">免打扰时段</p>
                        <span class="text-xs font-semibold text-indigo-600">已启用</span>
                    </div>
                    <div class="mt-3 grid grid-cols-2 gap-3 text-sm">
                        <div class="rounded-2xl bg-slate-50 px-4 py-3">
                            <p class="text-xs text-gray-400">开始时间</p>
                            <p class="mt-1 font-semibold text-gray-900">22:00</p>
                        </div>
                        <div class="rounded-2xl bg-slate-50 px-4 py-3">
                            <p class="text-xs text-gray-400">结束时间</p>
                            <p class="mt-1 font-semibold text-gray-900">07:00</p>
                        </div>
                    </div>
                    <p class="mt-3 text-xs text-gray-500">健康异常提醒不受免打扰影响。</p>
                </div>
            </section>
        </main>

        <div class="px-4 pb-4 pt-3 bg-white border-t border-slate-200">
            <div class="flex gap-3">
                <a href="profile.html" class="flex-1 rounded-2xl bg-slate-100 text-slate-700 text-center py-4 font-semibold">返回我的</a>
                <a href="profile.html" class="flex-[1.4] rounded-2xl bg-indigo-500 text-white text-center py-4 font-semibold shadow-lg shadow-indigo-200">保存消息配置</a>
            </div>
        </div>
    </div>
</body>
</html>
