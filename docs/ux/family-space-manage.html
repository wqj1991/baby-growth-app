<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家庭空间管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-emerald-50 font-sans">
    <div class="flex flex-col h-screen">
        <div class="bg-white/80 backdrop-blur-sm h-10 flex items-center justify-between px-4 text-sm font-medium text-gray-800 shadow-sm z-10">
            <div>10:41</div>
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-signal"></i>
                <i class="fa-solid fa-wifi"></i>
                <i class="fa-solid fa-battery-full fa-lg"></i>
            </div>
        </div>

        <main class="flex-1 overflow-y-auto custom-scrollbar pb-8">
            <header class="bg-gradient-to-br from-emerald-500 via-teal-500 to-cyan-500 px-5 pt-5 pb-8 text-white rounded-b-[32px] shadow-lg">
                <div class="flex items-center justify-between">
                    <a href="profile.html" class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center">
                        <i class="fa-solid fa-arrow-left"></i>
                    </a>
                    <span class="text-sm font-medium tracking-wide">家庭空间</span>
                    <button class="text-sm font-semibold">邀请</button>
                </div>
                <h1 class="mt-6 text-3xl font-bold">家庭空间管理</h1>
                <p class="mt-2 text-sm text-white/85">管理成员权限、共享范围与操作日志，保障协作顺畅。</p>
            </header>

            <section class="px-4 -mt-5 space-y-4">
                <div class="bg-white rounded-3xl shadow-sm p-4">
                    <div class="flex items-center justify-between">
                        <p class="text-sm font-semibold text-gray-900">成员列表</p>
                        <span class="text-xs text-emerald-600 font-semibold">3 人在线</span>
                    </div>
                    <div class="mt-3 space-y-3 text-sm">
                        <div class="rounded-2xl bg-emerald-50 border border-emerald-100 px-4 py-3 flex items-center gap-3">
                            <img class="w-10 h-10 rounded-full object-cover" src="assets/images/profile-avatar.jpg" alt="爸爸">
                            <div class="flex-1">
                                <p class="font-semibold text-gray-900">爸爸</p>
                                <p class="text-xs text-gray-500 mt-1">管理员</p>
                            </div>
                            <button class="text-xs font-semibold text-emerald-700">权限设置</button>
                        </div>
                        <div class="rounded-2xl bg-slate-50 px-4 py-3 flex items-center gap-3">
                            <img class="w-10 h-10 rounded-full object-cover" src="assets/images/mom-avatar.jpg" alt="妈妈">
                            <div class="flex-1">
                                <p class="font-semibold text-gray-900">妈妈</p>
                                <p class="text-xs text-gray-500 mt-1">可编辑全部记录</p>
                            </div>
                            <button class="text-xs font-semibold text-slate-600">权限设置</button>
                        </div>
                        <div class="rounded-2xl bg-slate-50 px-4 py-3 flex items-center gap-3">
                            <img class="w-10 h-10 rounded-full object-cover" src="assets/images/dad-avatar.jpg" alt="奶奶">
                            <div class="flex-1">
                                <p class="font-semibold text-gray-900">奶奶</p>
                                <p class="text-xs text-gray-500 mt-1">仅查看 + 评论</p>
                            </div>
                            <button class="text-xs font-semibold text-slate-600">权限设置</button>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-3xl shadow-sm p-4">
                    <p class="text-sm font-semibold text-gray-900">共享范围</p>
                    <div class="mt-3 space-y-3 text-sm">
                        <div class="rounded-2xl bg-slate-50 px-4 py-3 flex items-center justify-between">
                            <span>时间轴记录共享</span>
                            <i class="fa-solid fa-toggle-on text-emerald-500 text-2xl"></i>
                        </div>
                        <div class="rounded-2xl bg-slate-50 px-4 py-3 flex items-center justify-between">
                            <span>健康记录共享</span>
                            <i class="fa-solid fa-toggle-on text-emerald-500 text-2xl"></i>
                        </div>
                        <div class="rounded-2xl bg-slate-50 px-4 py-3 flex items-center justify-between">
                            <span>原图/原视频下载权限</span>
                            <i class="fa-solid fa-toggle-off text-slate-300 text-2xl"></i>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-3xl shadow-sm p-4">
                    <p class="text-sm font-semibold text-gray-900">最近操作日志</p>
                    <div class="mt-3 space-y-3 text-xs text-gray-600">
                        <div class="rounded-2xl bg-slate-50 px-4 py-3">妈妈 编辑了喂养记录 · 10:12</div>
                        <div class="rounded-2xl bg-slate-50 px-4 py-3">奶奶 评论了睡眠记录 · 09:47</div>
                        <div class="rounded-2xl bg-slate-50 px-4 py-3">爸爸 修改了健康记录开关 · 08:25</div>
                    </div>
                </div>
            </section>
        </main>

        <div class="px-4 pb-4 pt-3 bg-white border-t border-slate-200">
            <div class="flex gap-3">
                <a href="profile.html" class="flex-1 rounded-2xl bg-slate-100 text-slate-700 text-center py-4 font-semibold">返回我的</a>
                <a href="profile.html" class="flex-[1.4] rounded-2xl bg-emerald-500 text-white text-center py-4 font-semibold shadow-lg shadow-emerald-200">保存空间设置</a>
            </div>
        </div>
    </div>
</body>
</html>
