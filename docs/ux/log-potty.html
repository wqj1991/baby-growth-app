<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大小便记录</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-amber-50 font-sans">
    <div class="flex flex-col h-screen">
        <div class="bg-white/80 backdrop-blur-sm h-10 flex items-center justify-between px-4 text-sm font-medium text-gray-800 shadow-sm z-10">
            <div>10:37</div>
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-signal"></i>
                <i class="fa-solid fa-wifi"></i>
                <i class="fa-solid fa-battery-full fa-lg"></i>
            </div>
        </div>

        <main class="flex-1 overflow-y-auto custom-scrollbar pb-8">
            <header class="bg-gradient-to-br from-amber-400 via-orange-400 to-rose-400 px-5 pt-5 pb-8 text-white rounded-b-[32px] shadow-lg">
                <div class="flex items-center justify-between">
                    <a href="record.html" class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center">
                        <i class="fa-solid fa-arrow-left"></i>
                    </a>
                    <span class="text-sm font-medium tracking-wide">日常护理</span>
                    <button class="text-sm font-semibold">模板</button>
                </div>
                <h1 class="mt-6 text-3xl font-bold">大小便记录</h1>
                <p class="mt-2 text-sm text-white/85">方便家人快速同步尿布情况，也便于观察规律变化。</p>
            </header>

            <section class="px-4 -mt-5 space-y-4">
                <div class="bg-white rounded-3xl shadow-sm p-4">
                    <p class="text-sm font-semibold text-gray-900">事件类型</p>
                    <div class="mt-3 grid grid-cols-2 gap-3">
                        <button class="rounded-2xl bg-amber-500 text-white py-4 font-semibold">小便</button>
                        <button class="rounded-2xl bg-slate-100 text-slate-600 py-4 font-semibold">大便</button>
                    </div>
                </div>

                <div class="bg-white rounded-3xl shadow-sm p-4">
                    <p class="text-sm font-semibold text-gray-900">情况选择</p>
                    <div class="mt-3 grid grid-cols-3 gap-2 text-sm">
                        <button class="rounded-2xl bg-amber-100 text-amber-700 py-3 font-medium">正常</button>
                        <button class="rounded-2xl bg-slate-100 text-slate-600 py-3 font-medium">偏多</button>
                        <button class="rounded-2xl bg-slate-100 text-slate-600 py-3 font-medium">偏少</button>
                        <button class="rounded-2xl bg-slate-100 text-slate-600 py-3 font-medium">偏稀</button>
                        <button class="rounded-2xl bg-slate-100 text-slate-600 py-3 font-medium">偏硬</button>
                        <button class="rounded-2xl bg-slate-100 text-slate-600 py-3 font-medium">需观察</button>
                    </div>
                </div>

                <div class="bg-white rounded-3xl shadow-sm p-4">
                    <div class="flex items-center justify-between">
                        <p class="text-sm font-semibold text-gray-900">换尿布时间</p>
                        <span class="text-xs text-amber-600 font-medium">今天已记录 6 次</span>
                    </div>
                    <div class="mt-3 rounded-2xl bg-amber-50 border border-amber-100 p-4">
                        <div class="flex items-center justify-between text-sm text-gray-500">
                            <span>最近一次</span>
                            <span>09:15</span>
                        </div>
                        <div class="mt-2 text-2xl font-bold text-gray-900">10:38</div>
                        <div class="mt-3 h-2 rounded-full bg-amber-100 overflow-hidden">
                            <div class="h-full w-3/5 bg-amber-400 rounded-full"></div>
                        </div>
                        <p class="mt-2 text-xs text-gray-500">距离上次间隔 1 小时 23 分钟</p>
                    </div>
                </div>

                <div class="bg-white rounded-3xl shadow-sm p-4">
                    <p class="text-sm font-semibold text-gray-900">附加信息</p>
                    <div class="mt-3 space-y-3 text-sm text-gray-700">
                        <div class="flex items-center justify-between rounded-2xl bg-slate-50 px-4 py-3">
                            <span>是否红屁屁护理</span>
                            <i class="fa-solid fa-toggle-on text-emerald-500 text-2xl"></i>
                        </div>
                        <div class="flex items-center justify-between rounded-2xl bg-slate-50 px-4 py-3">
                            <span>是否拍照留档</span>
                            <i class="fa-solid fa-toggle-off text-slate-300 text-2xl"></i>
                        </div>
                        <div class="rounded-2xl border border-dashed border-slate-200 px-4 py-3 text-gray-400">补充描述：颜色、状态、是否更换品牌等</div>
                    </div>
                </div>
            </section>
        </main>

        <div class="px-4 pb-4 pt-3 bg-white border-t border-slate-200">
            <div class="flex gap-3">
                <a href="record.html" class="flex-1 rounded-2xl bg-slate-100 text-slate-700 text-center py-4 font-semibold">取消</a>
                <a href="home.html" class="flex-[1.4] rounded-2xl bg-amber-500 text-white text-center py-4 font-semibold shadow-lg shadow-amber-200">保存护理记录</a>
            </div>
        </div>
    </div>
</body>
</html>
