<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宝宝档案编辑</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-cyan-50 font-sans">
    <div class="flex flex-col h-screen">
        <div class="bg-white/80 backdrop-blur-sm h-10 flex items-center justify-between px-4 text-sm font-medium text-gray-800 shadow-sm z-10">
            <div>10:40</div>
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-signal"></i>
                <i class="fa-solid fa-wifi"></i>
                <i class="fa-solid fa-battery-full fa-lg"></i>
            </div>
        </div>

        <main class="flex-1 overflow-y-auto custom-scrollbar pb-8">
            <header class="bg-gradient-to-br from-cyan-500 via-sky-500 to-blue-500 px-5 pt-5 pb-8 text-white rounded-b-[32px] shadow-lg">
                <div class="flex items-center justify-between">
                    <a href="profile.html" class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center">
                        <i class="fa-solid fa-arrow-left"></i>
                    </a>
                    <span class="text-sm font-medium tracking-wide">宝宝档案</span>
                    <button class="text-sm font-semibold">保存</button>
                </div>
                <h1 class="mt-6 text-3xl font-bold">档案编辑</h1>
                <p class="mt-2 text-sm text-white/85">完善宝宝基础资料、健康偏好和成长里程碑信息。</p>
            </header>

            <section class="px-4 -mt-5 space-y-4">
                <div class="bg-white rounded-3xl shadow-sm p-4">
                    <div class="flex items-center gap-4">
                        <div class="relative">
                            <img class="w-20 h-20 rounded-2xl object-cover" src="assets/images/baby-park.jpg" alt="宝宝头像">
                            <button class="absolute -bottom-2 -right-2 w-8 h-8 rounded-full bg-cyan-500 text-white shadow"><i class="fa-solid fa-camera text-xs"></i></button>
                        </div>
                        <div>
                            <p class="font-semibold text-gray-900 text-lg">小宝</p>
                            <p class="text-xs text-gray-500 mt-1">昵称可用于时间轴和家庭提醒</p>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-3xl shadow-sm p-4">
                    <p class="text-sm font-semibold text-gray-900">基础信息</p>
                    <div class="mt-3 grid grid-cols-2 gap-3 text-sm">
                        <div class="rounded-2xl bg-slate-50 px-4 py-3">
                            <p class="text-xs text-gray-400">性别</p>
                            <p class="mt-1 font-semibold text-gray-800">男</p>
                        </div>
                        <div class="rounded-2xl bg-slate-50 px-4 py-3">
                            <p class="text-xs text-gray-400">生日</p>
                            <p class="mt-1 font-semibold text-gray-800">2024-08-14</p>
                        </div>
                        <div class="rounded-2xl bg-slate-50 px-4 py-3">
                            <p class="text-xs text-gray-400">月龄</p>
                            <p class="mt-1 font-semibold text-gray-800">1岁 8个月</p>
                        </div>
                        <div class="rounded-2xl bg-slate-50 px-4 py-3">
                            <p class="text-xs text-gray-400">血型</p>
                            <p class="mt-1 font-semibold text-gray-800">待补充</p>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-3xl shadow-sm p-4">
                    <div class="flex items-center justify-between">
                        <p class="text-sm font-semibold text-gray-900">健康偏好与注意事项</p>
                        <button class="text-xs text-cyan-600 font-semibold">编辑</button>
                    </div>
                    <div class="mt-3 flex flex-wrap gap-2 text-sm">
                        <span class="px-4 py-2 rounded-full bg-rose-100 text-rose-700 font-medium">鸡蛋过敏待观察</span>
                        <span class="px-4 py-2 rounded-full bg-sky-100 text-sky-700 font-medium">夜间易醒</span>
                        <span class="px-4 py-2 rounded-full bg-emerald-100 text-emerald-700 font-medium">辅食偏爱南瓜</span>
                    </div>
                </div>

                <div class="bg-white rounded-3xl shadow-sm p-4">
                    <p class="text-sm font-semibold text-gray-900">成长里程碑</p>
                    <div class="mt-3 space-y-3 text-sm">
                        <div class="rounded-2xl bg-cyan-50 border border-cyan-100 px-4 py-3 flex items-center justify-between">
                            <div>
                                <p class="font-semibold text-gray-900">第一次翻身</p>
                                <p class="text-xs text-gray-500 mt-1">2025-01-10</p>
                            </div>
                            <i class="fa-solid fa-pen text-cyan-500"></i>
                        </div>
                        <div class="rounded-2xl bg-cyan-50 border border-cyan-100 px-4 py-3 flex items-center justify-between">
                            <div>
                                <p class="font-semibold text-gray-900">第一次独立行走</p>
                                <p class="text-xs text-gray-500 mt-1">2026-04-28</p>
                            </div>
                            <i class="fa-solid fa-pen text-cyan-500"></i>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <div class="px-4 pb-4 pt-3 bg-white border-t border-slate-200">
            <div class="flex gap-3">
                <a href="profile.html" class="flex-1 rounded-2xl bg-slate-100 text-slate-700 text-center py-4 font-semibold">取消</a>
                <a href="profile.html" class="flex-[1.4] rounded-2xl bg-cyan-500 text-white text-center py-4 font-semibold shadow-lg shadow-cyan-200">保存档案</a>
            </div>
        </div>
    </div>
</body>
</html>
