<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>症状记录</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-amber-50 font-sans">
    <div class="flex flex-col h-screen">
        <div class="bg-white/80 backdrop-blur-sm h-10 flex items-center justify-between px-4 text-sm font-medium text-gray-800 shadow-sm z-10">
            <div>10:53</div>
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-signal"></i>
                <i class="fa-solid fa-wifi"></i>
                <i class="fa-solid fa-battery-three-quarters fa-lg"></i>
            </div>
        </div>
        <main class="flex-1 overflow-y-auto custom-scrollbar pb-8">
            <header class="bg-gradient-to-br from-amber-400 via-orange-400 to-yellow-500 px-5 pt-5 pb-8 text-white rounded-b-[32px] shadow-lg">
                <div class="flex items-center justify-between">
                    <a href="log-health-more.html" class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center"><i class="fa-solid fa-arrow-left"></i></a>
                    <span class="text-sm font-medium tracking-wide">健康记录</span>
                    <button class="text-sm font-semibold">观察</button>
                </div>
                <h1 class="mt-6 text-3xl font-bold">症状记录</h1>
                <p class="mt-2 text-sm text-white/85">记录咳嗽、流涕、呕吐、皮疹等异常表现，方便连续观察。</p>
            </header>
            <section class="px-4 -mt-5 space-y-4">
                <div class="bg-white rounded-3xl shadow-sm p-4">
                    <p class="text-sm font-semibold text-gray-900">症状类型</p>
                    <div class="mt-3 grid grid-cols-2 gap-3 text-sm">
                        <button class="rounded-2xl bg-amber-500 text-white py-3 font-semibold">咳嗽</button>
                        <button class="rounded-2xl bg-slate-100 text-slate-600 py-3 font-semibold">流涕</button>
                        <button class="rounded-2xl bg-slate-100 text-slate-600 py-3 font-semibold">呕吐</button>
                        <button class="rounded-2xl bg-slate-100 text-slate-600 py-3 font-semibold">皮疹</button>
                    </div>
                </div>
                <div class="bg-white rounded-3xl shadow-sm p-4">
                    <div class="flex items-center justify-between">
                        <p class="text-sm font-semibold text-gray-900">严重程度</p>
                        <span class="text-xs text-amber-600 font-medium">中度</span>
                    </div>
                    <div class="mt-3 rounded-3xl bg-amber-50 border border-amber-100 p-4 text-center">
                        <p class="text-4xl font-bold text-amber-600">2 / 3</p>
                        <input type="range" min="1" max="3" value="2" class="w-full mt-4 accent-amber-500">
                    </div>
                </div>
                <div class="bg-white rounded-3xl shadow-sm p-4">
                    <p class="text-sm font-semibold text-gray-900">伴随表现</p>
                    <div class="mt-3 flex flex-wrap gap-2 text-sm">
                        <button class="px-4 py-2 rounded-full bg-amber-100 text-amber-700 font-medium">夜里更明显</button>
                        <button class="px-4 py-2 rounded-full bg-slate-100 text-slate-600 font-medium">影响睡眠</button>
                        <button class="px-4 py-2 rounded-full bg-slate-100 text-slate-600 font-medium">食欲变差</button>
                    </div>
                    <div class="mt-4 rounded-2xl border border-dashed border-slate-200 px-4 py-4 text-sm text-gray-400">备注：出现频率、持续时长、是否和发热一起出现</div>
                </div>
            </section>
        </main>
        <div class="px-4 pb-4 pt-3 bg-white border-t border-slate-200">
            <div class="flex gap-3">
                <a href="log-health-more.html" class="flex-1 rounded-2xl bg-slate-100 text-slate-700 text-center py-4 font-semibold">取消</a>
                <a href="home.html" class="flex-[1.4] rounded-2xl bg-amber-500 text-white text-center py-4 font-semibold shadow-lg shadow-amber-200">保存症状记录</a>
            </div>
        </div>
    </div>
</body>
</html>
